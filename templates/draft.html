{% extends "base.html" %}
{% block content %}

<section class="resource-draft">

    <header class="resource-draft__header">
        <h1 class="resource-draft__title">Добавление</h1>
        <span class="status-badge status-badge--draft">Черновик</span>
    </header>

    {% if resource %}
    <div class="upload-row">
        <div class="upload-field">
            <span class="upload-field__icon">&#9654;</span>
            Видео ресурса
        </div>
        <div class="upload-field">
            <span class="upload-field__icon">&#9632;</span>
            Изображение
        </div>
    </div>

    <label class="form-label" for="resource_name">Название ресурса</label>
    <input class="form-input" id="resource_name" type="text"
           value="{{ resource.resource_name }}">

    <label class="form-label" for="equipment">Оборудование</label>
    <input class="form-input" id="equipment" type="text"
           value="{{ resource.equipment }}">

    <label class="form-label" for="unit">Единица измерения</label>
    <select class="form-input" id="unit">
        <option {% if resource.unit == 'м²' %}selected{% endif %}>м²</option>
        <option {% if resource.unit == 'кВт·ч' %}selected{% endif %}>кВт·ч</option>
        <option {% if resource.unit == 'Гкал' %}selected{% endif %}>Гкал</option>
        <option {% if resource.unit == 'м³' %}selected{% endif %}>м³</option>
        <option {% if resource.unit == 'кг' %}selected{% endif %}>кг</option>
        <option {% if resource.unit == 'м³/ч' %}selected{% endif %}>м³/ч</option>
    </select>

    <label class="form-label" for="min_value">Минимальное значение</label>
    <input class="form-input" id="min_value" type="number" step="0.1"
           value="{{ resource.min_value }}">

    <label class="form-label" for="short_description">Описание</label>
    <textarea class="form-input form-input--area" id="short_description"
              rows="3">{{ resource.short_description }}</textarea>

    <form method="post" action="/greenhouse_resources/publish">
        <input type="hidden" name="resource_id" value="{{ resource.resource_id }}">
        <input type="hidden" name="short_description" value="{{ resource.short_description }}">
        <input type="hidden" name="unit" value="{{ resource.unit }}">
        <input type="hidden" name="min_value" value="{{ resource.min_value or 0 }}">
        <button class="greenhouse-button" type="submit">Опубликовать</button>
    </form>
    {% else %}
    <form method="post" action="/greenhouse_resources/create">
        <label class="form-label" for="new_name">Название ресурса</label>
        <input class="form-input" id="new_name" name="resource_name" type="text" required>
        <p class="form-note">Изображение и видео подставляются по умолчанию.</p>
        <button class="greenhouse-button" type="submit">Далее</button>
    </form>
    {% endif %}

</section>

{% endblock %}
