{# Если файл в Minio недоступен или url пустой — браузер сам
   показывает файл по умолчанию с SSR-сервера (без JavaScript):
   у <object> срабатывает вложенный <img>, у <video> — следующий <source> #}

{% macro resource_image(url, css_class, alt="") %}
{% if url %}
<object class="{{ css_class }}" data="{{ url }}" type="image/jpeg">
    <img class="{{ css_class }}" src="{{ default_image_url }}" alt="{{ alt }}">
</object>
{% else %}
<img class="{{ css_class }}" src="{{ default_image_url }}" alt="{{ alt }}">
{% endif %}
{% endmacro %}

{% macro resource_video(url, css_class) %}
<video class="{{ css_class }}" autoplay muted loop playsinline>
    {% if url %}<source src="{{ url }}" type="video/mp4">{% endif %}
    <source src="{{ default_video_url }}" type="video/mp4">
</video>
{% endmacro %}
